<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>물품 자동 선택</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>물품 자동 선택</h1>
    <div id="mallStatus" class="mall-status">페이지 확인 중&hellip;</div>
  </header>

  <section class="card">
    <div id="dropZone">
      <p class="drop-main">엑셀 파일을 여기에 끌어다 놓으세요</p>
      <p class="drop-sub">또는 <button id="pickBtn" type="button" class="link-btn">엑셀 파일 열기</button></p>
      <input id="fileInput" type="file" accept=".xls,.xlsx" hidden>
    </div>
    <div id="fileInfo" class="hidden"></div>
    <div id="validateMsg" class="msg hidden"></div>
  </section>

  <section class="card row">
    <label for="toleranceSelect">금액 무시 한도</label>
    <select id="toleranceSelect">
      <option value="0">설정 안함</option>
      <option value="100">100원</option>
      <option value="200">200원</option>
      <option value="300">300원</option>
      <option value="500">500원</option>
      <option value="1000">1,000원</option>
      <option value="1500">1,500원</option>
      <option value="2000">2,000원</option>
    </select>
  </section>

  <button id="runBtn" type="button" class="primary" disabled>자동 선택 시작</button>

  <section id="resultSection" class="hidden">
    <div id="summary" class="summary"></div>
    <div id="otherMallInfo" class="other-mall hidden"></div>
    <nav id="filterTabs" class="tabs">
      <button type="button" data-filter="all" class="active">전체</button>
      <button type="button" data-filter="ok">선택 완료</button>
      <button type="button" data-filter="issue">확인 필요</button>
    </nav>
    <ul id="resultList"></ul>
    <button id="copyAllBtn" type="button">전체 안내문 복사</button>
  </section>

  <div id="toast" class="toast hidden">복사되었습니다.</div>

  <script src="../vendor/xlsx.full.min.js"></script>
  <script src="../content/core.js"></script>
  <script src="../content/rules-data.js"></script>
  <script src="popup.js"></script>
</body>
</html>
